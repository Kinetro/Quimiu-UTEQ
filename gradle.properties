# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Cachea resultados de tasks entre builds (evita recompilar/reprocesar lo que no cambió).
org.gradle.caching=true
# Cachea la fase de configuración de Gradle (evaluar build.gradle.kts, resolver plugins, etc.),
# que en AGP 9 es buena parte del tiempo de un build chico como este.
org.gradle.configuration-cache=true
# Fija el JDK que usa Gradle para compilar. Sin esto, la auto-detección de
# toolchains de Gradle puede elegir un JRE recortado de alguna extensión del
# IDE (sin jlink) en vez del JDK del sistema, y el build falla con un error
# de "JdkImageTransform".
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# Workaround: tensorflow-lite-support y tensorflow-lite-support-api (0.4.4) declaran
# el mismo namespace de manifest, lo que AGP 9 rechaza por defecto. Es un problema
# conocido del artefacto de TensorFlow (no del proyecto).
android.uniquePackageNames=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true