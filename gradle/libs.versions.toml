[versions]
agp = "9.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.1"
camerax = "1.4.1"
tensorflowLite = "2.16.1"
tensorflowLiteSupport = "0.4.4"
coroutines = "1.9.0"
lifecycle = "2.8.7"
# ML Kit GenAI Prompt API (Gemini Nano on-device). Es beta ("no SLA ni política de
# deprecación" según la doc oficial) por lo que el número de versión puede subir seguido;
# revisar https://developers.google.com/ml-kit/genai/prompt/android/get-started si el
# build falla por versión no encontrada.
mlkitGenaiPrompt = "1.0.0-beta2"
gson = "2.11.0"
# Google AI SDK (Gemini en la nube, fallback cuando Gemini Nano on-device no está
# disponible o falla, ver ai/GeminiCloudService.kt).
googleGenAi = "0.9.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# CameraX
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# TensorFlow Lite
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
tensorflow-lite-support = { group = "org.tensorflow", name = "tensorflow-lite-support", version.ref = "tensorflowLiteSupport" }

# ML Kit GenAI Prompt API (Gemini Nano 100% on-device, sin red ni API key)
mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "mlkitGenaiPrompt" }

# Gson (parseo de app/src/main/assets/info_equipos.json, el fallback local)
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Google AI SDK (Gemini en la nube, fallback con API key, ver ai/GeminiCloudService.kt)
google-genai = { group = "com.google.ai.client.generativeai", name = "generativeai", version.ref = "googleGenAi" }

# Corrutinas
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Lifecycle / ViewModel (MVVM)
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
